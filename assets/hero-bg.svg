<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spot" cx="72%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3a0d15"/>
      <stop offset="35%" stop-color="#1a0a0d"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2d2d" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2d2d" stop-opacity=".9"/>
      <stop offset="60%" stop-color="#c8102e" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#spot)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <!-- diagonal light beam -->
  <polygon points="1600,0 1600,520 760,900 1180,0" fill="url(#beam)" opacity=".5"/>

  <!-- stylized athlete: overhead barbell press silhouette -->
  <g fill="#050506" transform="translate(1015,150)">
    <!-- barbell bar -->
    <rect x="-230" y="0" width="620" height="26" rx="6" fill="#101014"/>
    <!-- plates -->
    <g fill="#141418" stroke="#2a2a30" stroke-width="3">
      <rect x="-250" y="-34" width="34" height="94" rx="8"/>
      <rect x="-210" y="-20" width="26" height="66" rx="6"/>
      <rect x="356" y="-34" width="34" height="94" rx="8"/>
      <rect x="322" y="-20" width="26" height="66" rx="6"/>
    </g>
    <!-- accent plate rim -->
    <rect x="-250" y="-34" width="34" height="94" rx="8" fill="none" stroke="#ff2d2d" stroke-opacity=".5" stroke-width="2"/>
    <rect x="356" y="-34" width="34" height="94" rx="8" fill="none" stroke="#ff2d2d" stroke-opacity=".5" stroke-width="2"/>
    <!-- arms + torso -->
    <path d="M60 20 L70 120 L58 128 L48 40 Z"/>
    <path d="M300 20 L290 120 L302 128 L312 40 Z"/>
    <path d="M96 128 q84 -26 168 0 l14 250 q-98 34 -196 0 Z"/>
    <!-- head -->
    <circle cx="180" cy="104" r="34"/>
    <!-- legs -->
    <path d="M120 372 l-20 260 40 6 34 -230 34 230 40 -6 -20 -260 Z"/>
  </g>

  <!-- glow behind figure -->
  <circle cx="1195" cy="300" r="360" fill="url(#glow)" opacity=".35"/>

  <!-- grain -->
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/></filter>
  <rect width="1600" height="900" filter="url(#n)" opacity=".05"/>
</svg>
